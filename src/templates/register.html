{% extends "base.html" %}
{% block title %}Реєстрація{% endblock %}
{% block login_content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-brand">SUPPLAX</div>
    <h1 class="sora">Реєстрація в порт­фелі автоматизацій</h1>
    <label>Ім'я
      <input type="text" name="name" required autofocus>
    </label>
    <label>Email
      <input type="email" name="email" required>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <label>Повтори пароль
      <input type="password" name="password_confirm" required>
    </label>
    <button type="submit" class="btn btn-primary" style="justify-content:center">Зареєструватися</button>
    <p class="login-note">
      Після реєстрації код підтвердження прийде адміністратору в Telegram — попроси його
      назвати тобі код і <a href="{{ url_for('login') }}">увійди</a>, коли він надасть доступ.
    </p>
  </form>
</div>
{% endblock %}
