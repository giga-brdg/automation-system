{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block login_content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="login-brand">SUPPLAX</div>
    <h1 class="sora">Вхід у портфель автоматизацій</h1>
    <label>Email
      <input type="email" name="email" required autofocus>
    </label>
    <label>Пароль
      <input type="password" name="password" required>
    </label>
    <button type="submit" class="btn btn-primary" style="justify-content:center">Увійти</button>
    <p class="login-note">Немає акаунта? <a href="{{ url_for('register') }}">Зареєструйся</a> —
      доступ підтверджує адміністратор у Telegram.</p>
  </form>
</div>
{% endblock %}
